services:
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: wedding-planner-php
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db

  reverb:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: wedding-planner-reverb
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    command: php artisan reverb:start

  node:
    build:
      context: ./resources
      dockerfile: ../.docker/node/Dockerfile
    container_name: wedding-planner-node
    working_dir: /app
    volumes:
      - ./resources:/app
      - node_modules_data:/app/node_modules
      - ./.env:/app/.env
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: wedding-planner-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-wedding}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-wedding-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/$${BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-wedding}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-wedding-secret}
      BUCKET: ${AWS_BUCKET:-wedding-gallery}

  db:
    image: postgres:16
    container_name: wedding-planner-db
    command: postgres -p ${DB_PORT}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  vendor_data:
  node_modules_data:
  minio_data:
