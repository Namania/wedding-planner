services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: wending-planner-app
    working_dir: /var/www
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Front and API are same-origin here (localhost:8080), unlike the
      # dev setup (localhost:5173 + localhost:8000) — override the .env
      # values that assume the split dev origins.
      APP_URL: http://localhost:8080
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: wending-planner-db
    command: postgres -p ${DB_PORT}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
