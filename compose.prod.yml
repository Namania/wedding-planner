x-back-env: &back-env
  APP_NAME: ${APP_NAME}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  FRONTEND_URL: ${APP_URL}

  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: error

  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: ${APP_DOMAIN}
  SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}
  SESSION_SECURE_COOKIE: "true"

  QUEUE_CONNECTION: database
  CACHE_STORE: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: log

  GALLERY_DISK: s3
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET}
  AWS_ENDPOINT: ${AWS_ENDPOINT}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: wedding-reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"

services:
  wedding-front:
    image: ${FRONT_IMAGE}
    restart: unless-stopped
    environment:
      VITE_APP_NAME: ${APP_NAME}
      VITE_API_BASE_URL: ${APP_URL}/api
      VITE_ALLOWED_HOST: ${APP_DOMAIN}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${APP_DOMAIN}
      VITE_REVERB_PORT: "443"
      VITE_REVERB_SCHEME: https
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network

  wedding-back:
    image: ${BACK_IMAGE}
    restart: unless-stopped
    environment: *back-env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network

  wedding-reverb:
    image: ${BACK_IMAGE}
    restart: unless-stopped
    environment:
      <<: *back-env
      APP_ROLE: reverb
    expose:
      - "8080"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
