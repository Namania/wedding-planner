server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers versionnés par Vite (hash dans le nom) ne changent jamais
    # pour une URL donnée.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit jamais être mis en cache : c'est lui qui référence le
    # hash des assets, et c'est dans lui que les variables runtime sont
    # substituées au démarrage du conteneur.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Le routeur Vue est en mode history : toute URL inconnue doit renvoyer
    # index.html, sinon un rechargement sur /guests donne un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
