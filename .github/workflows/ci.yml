name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, gd, zip, exif, pcntl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test

  frontend:
    name: Front — lint, types & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: resources/package-lock.json

      - run: npm ci

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Vérification des types
        run: npm run type-check

      - name: Tests
        run: npm run test

  release:
    name: Image & tag
    needs: [php, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A release is named after its day, `v2026.09.25`, with `.2`, `.3`
      # after it when the same day ships twice. Nothing to bump by hand,
      # and the name says when it went out. The same name goes on the
      # images and on the commit, so a rollback in Dokploy is one tag.
      - name: Name the release
        id: release
        run: |
          base="v$(date -u +%Y.%m.%d)"
          name="$base"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/$name" >/dev/null 2>&1; do
            n=$((n + 1))
            name="$base.$n"
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release $name"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/back/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wedding-planner-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wedding-planner-back:${{ steps.release.outputs.name }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wedding-planner-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wedding-planner-front:${{ steps.release.outputs.name }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

      - name: Tag the commit
        env:
          RELEASE: ${{ steps.release.outputs.name }}
          ACCOUNT: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE" -m "Release $RELEASE

          Images: $ACCOUNT/wedding-planner-back:$RELEASE, $ACCOUNT/wedding-planner-front:$RELEASE"
          git push origin "refs/tags/$RELEASE"
